# Legacy Config as Code for an existing Railway service. New Railway services
# must set these values in the dashboard or migrate to .railway/railway.ts.
[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
preDeployCommand = ["npm run deploy:prepare"]
startCommand = "npm start"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
